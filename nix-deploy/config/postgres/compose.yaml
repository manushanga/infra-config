version: '3.1'

services:
  postgres:
    image: postgres:18.3
    container_name: postgres_server
    environment:
      POSTGRES_USER: "dbuser01"
      POSTGRES_PASSWORD_FILE: "/run/secrets/pgpass"
      POSTGRES_DB: "ordersdb"
    secrets:
      - pgpass
    volumes:
      - /storage/A/Database:/var/lib/postgresql
    ports:
      - 5432:5432
secrets:
  pgpass:
    file: ./pgpass.txt

